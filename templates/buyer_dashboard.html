{% extends "base.html" %}
{% block content %}
<div class="container my-5">
    <!-- Dashboard Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Buyer Dashboard</h1>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </div>

    <!-- Orders Section -->
    <section class="mb-5">
        <h2 class="text-secondary">Your Orders</h2>
        {% if orders %}
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <!-- <th>Order Date</th> -->
                    </tr>
                </thead>
                <tbody>
                    {% for order in orders %}
                    <tr>
                        <td>{{ order.product.name }}</td>
                        <td>{{ order.quantity }}</td>
                        <!-- <td>{{ order.order_date }}</td> -->
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p class="text-center text-muted mt-3">You have no orders yet. Start shopping now!</p>
        {% endif %}
    </section>
</div>
{% endblock %}
